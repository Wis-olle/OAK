<script>
    /* Today in the visitor's own timezone — toISOString() alone would roll over in UTC+7. */
    function oakTodayISO() {
        const now = new Date();
        return new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    }

    /* Now as a local 'HH:MM', so an hour today that has already started is not offered. */
    function oakNowTime() {
        const now = new Date();
        const pad = (value) => String(value).padStart(2, '0');
        return pad(now.getHours()) + ':' + pad(now.getMinutes());
    }

    function oakServiceDetail() {
        return {
            filled: "font-variation-settings: 'FILL' 1;",
            service: null,
            detailPhotos: [],
            staff: [],
            slots: [],
            related: [],
            reviews: [],
            reviewMeta: { total: 0, average: 0 },
            today: oakTodayISO(),
            date: oakTodayISO(),
            time: '',
            staffId: null,
            slotsToken: 0,
            isFavorite: false,
            loading: true,

            async init() {
                try {
                    this.service = await OAK.api('/api/services/' + (await this.resolveId()));
                    OAK.meta({
                        title: this.service.name + ' - OAK Beauty',
                        description: this.service.description,
                        image: this.service.image,
                    });

                    const salonId = this.service.salon.id;
                    const [staff, photos, related, reviews] = await Promise.all([
                        OAK.api('/api/services/' + this.service.id + '/staff'),
                        OAK.api('/api/salons/' + salonId + '/photos'),
                        OAK.api('/api/services?salon_id=' + salonId + '&limit=5'),
                        OAK.api('/api/salons/' + salonId + '/reviews?limit=4'),
                    ]);

                    this.staff = staff;
                    // The service already owns the hero image, so the two detail tiles show
                    // other photos of the salon it is performed in.
                    this.detailPhotos = photos
                        .filter((photo) => photo.image !== this.service.image)
                        .slice(0, 2);
                    this.related = related.filter((item) => item.id !== this.service.id).slice(0, 4);
                    this.reviews = reviews;
                    this.reviewMeta = { total: reviews.meta.total, average: reviews.meta.average };

                    await this.loadSlots();
                    await this.loadFavorite();
                } catch (error) {
                    OAK.toast(error.message, 'error');
                } finally {
                    this.loading = false;
                }
            },

            /** ?id=, or the first nail service so the page is never empty. */
            async resolveId() {
                const id = OAK.qs('id');
                if (id) {
                    return encodeURIComponent(id);
                }
                const [first] = await OAK.api('/api/services?category=nail&limit=1');
                if (!first) {
                    throw new Error('Không tìm thấy dịch vụ này.');
                }
                return first.id;
            },

            salonUrl() {
                return 'salon-profile.html?salon=' + encodeURIComponent(this.service.salon.slug);
            },

            /** '09:00 – 20:00', or nothing at all when the salon has not filled its hours in. */
            hoursRange() {
                const salon = this.service.salon;
                return salon.open_time && salon.close_time
                    ? salon.open_time + ' – ' + salon.close_time
                    : '';
            },

            /** The salon writes its number as it pleases ('0901 234 567'); tel: wants digits. */
            digits(phone) {
                return String(phone).replace(/\D/g, '');
            },

            /** zalo.me addresses a Vietnamese number in international form: 090… -> 8490…  */
            zaloUrl() {
                return 'https://zalo.me/' + this.digits(this.service.salon.phone).replace(/^0/, '84');
            },

            priceLabel() {
                return OAK.fmtPriceFrom(this.service.price, this.service.price_is_from);
            },

            slotHeading() {
                return this.date === this.today ? 'Lịch trống hôm nay' : 'Lịch trống ' + OAK.fmtDate(this.date);
            },

            async loadSlots() {
                this.time = '';
                const token = ++this.slotsToken;
                if (!this.date) {
                    this.slots = [];
                    return;
                }
                // A chosen technician has their own calendar. The service endpoint ORs across
                // everyone who performs it, so it would offer times this one person cannot
                // take. The two answer in different shapes, so the id is read once here: a
                // reply must be read as the shape the request that earned it was sent for.
                const staffId = this.staffId;
                const path = staffId
                    ? '/api/staff/' + staffId + '/availability?days=1&from=' + this.date
                        + '&service_id=' + this.service.id
                    : '/api/services/' + this.service.id + '/availability?date=' + this.date;
                try {
                    const data = await OAK.api(path);
                    if (token !== this.slotsToken) {
                        return;
                    }
                    // An hour that has already started today cannot be booked any more; the
                    // server refuses it too, so offering it would only end in an error.
                    const passed = this.date === this.today ? oakNowTime() : '';
                    this.slots = (staffId ? data.week[0].slots : data.slots)
                        .filter((slot) => slot.available && slot.time > passed);
                } catch (error) {
                    if (token !== this.slotsToken) {
                        return;
                    }
                    this.slots = [];
                    OAK.toast(error.message, 'error');
                }
            },

            /** Picking a technician narrows the times above to that one person's calendar;
                picking them again widens it out to everyone who performs the service. */
            pickStaff(id) {
                this.staffId = this.staffId === id ? null : id;
                this.loadSlots();
            },

            /**
             * The composer is per booking, so this picks the most recent completed booking
             * at this salon that has not been reviewed yet — this very service first,
             * any other after.
             */
            async writeReview() {
                await OAK.requireLogin();
                try {
                    const [completed, myReviews] = await Promise.all([
                        OAK.api('/api/bookings/mine?status=completed&limit=50'),
                        OAK.api('/api/reviews/mine'),
                    ]);
                    const reviewed = myReviews.map((review) => review.booking_id);
                    const here = completed.filter(
                        (booking) => booking.salon.id === this.service.salon.id,
                    );
                    const pending = here.filter((booking) => !reviewed.includes(booking.id));
                    const target = pending.find((booking) => booking.service.id === this.service.id)
                        || pending[0];
                    if (target) {
                        window.location.href = 'danh-gia-cua-toi.html?booking_id=' + target.id;
                        return;
                    }
                    // Only the newest 50 came back, so an older booking here may exist:
                    // hand the visitor the full "Chờ đánh giá" list instead of claiming
                    // there is nothing to review.
                    if (completed.meta.total > completed.length) {
                        window.location.href = 'danh-gia-cua-toi.html';
                        return;
                    }
                    OAK.toast(
                        here.length
                            ? 'Bạn đã đánh giá các lịch hẹn tại salon này rồi.'
                            : 'Bạn cần hoàn tất một lịch hẹn tại salon này trước khi viết đánh giá.',
                        'error',
                    );
                } catch (error) {
                    OAK.toast(error.message, 'error');
                }
            },

            async loadFavorite() {
                if (!(await OAK.me())) {
                    return;
                }
                const favorites = await OAK.api('/api/favorites');
                this.isFavorite = favorites.services.some((item) => item.id === this.service.id);
            },

            async toggleFavorite() {
                await OAK.requireLogin();
                const next = !this.isFavorite;
                try {
                    await OAK.api(
                        next ? '/api/favorites' : '/api/favorites?service_id=' + this.service.id,
                        next
                            ? { method: 'POST', body: { service_id: this.service.id } }
                            : { method: 'DELETE' },
                    );
                    this.isFavorite = next;
                    OAK.toast(next ? 'Đã lưu vào yêu thích.' : 'Đã bỏ khỏi yêu thích.');
                } catch (error) {
                    OAK.toast(error.message, 'error');
                }
            },

            /** dat-lich.html carrying whatever the visitor has picked so far. */
            bookingUrl() {
                const params = new URLSearchParams({
                    service_id: this.service.id,
                    salon_id: this.service.salon.id,
                });
                if (this.staffId) {
                    params.set('staff_id', this.staffId);
                }
                if (this.time) {
                    params.set('date', this.date);
                    params.set('time', this.time);
                }
                return 'dat-lich.html?' + params.toString();
            },
        };
    }
</script>
</body></html>
