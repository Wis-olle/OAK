<script>
    /* Inline scripts run before deferred ones, so this factory exists by the time Alpine boots. */
    function oakSalonDirectory() {
        return {
            q: '',
            /* The submitted keyword, snapshotted away from `q`: "Xem thêm" must repeat the
               search that produced page 1 even if the box has been edited since. */
            applied: '',
            salons: [],
            total: 0,
            page: 1,
            loading: true,
            /* An empty list means "nothing matched"; this means "we never got an answer". */
            loadError: false,

            init() {
                this.q = new URLSearchParams(location.search).get('q') || '';
                this.applied = this.q;
                this.load(1);
            },

            /* `page` is committed only once the request resolves, so a failed "Xem thêm"
               leaves the next click asking for the same page instead of skipping it. */
            async load(page, append) {
                this.loading = true;
                try {
                    var params = new URLSearchParams({ limit: 12, page: page });
                    if (this.applied) {
                        params.set('q', this.applied);
                    }
                    var data = await OAK.api('/api/salons?' + params);
                    this.page = page;
                    this.total = data.meta.total;
                    this.salons = append ? this.salons.concat(data) : data;
                    this.loadError = false;
                } catch (error) {
                    if (!append) {
                        this.salons = [];
                        this.total = 0;
                        this.loadError = true;
                    }
                    OAK.toast(error.message, 'error');
                } finally {
                    this.loading = false;
                }
            },

            /* Keep the address bar in sync so a reload or a shared link repeats the search. */
            search() {
                var query = this.q.trim();
                this.applied = query;
                history.replaceState(null, '', query ? '?q=' + encodeURIComponent(query) : location.pathname);
                this.load(1);
            },

            loadMore() {
                this.load(this.page + 1, true);
            },

            salonUrl(salon) {
                return 'salon-profile-lala-nail-studio.html?salon=' + encodeURIComponent(salon.slug);
            },

            ratingOf(salon) {
                return Number(salon.rating || 0).toFixed(1);
            },

            locationOf(salon) {
                return [salon.district, salon.city].filter(Boolean).join(', ');
            },
        };
    }
</script>
