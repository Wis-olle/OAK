<script>
    /* Inline scripts run before deferred ones, so this factory exists by the time Alpine boots. */

    /* Today in the visitor's own timezone — toISOString() alone would roll over in UTC+7. */
    function oakTodayISO() {
        const now = new Date();
        return new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    }

    function oakStaffProfile() {
        return {
            filled: "font-variation-settings: 'FILL' 1;",
            staff: null,
            week: [],
            reviews: [],
            reviewMeta: { total: 0, average: 0 },
            reviewPage: 1,
            date: '',
            time: '',
            lightbox: false,
            lightboxIndex: 0,
            loading: true,

            async init() {
                try {
                    const id = await this.resolveId();
                    const [profile, availability, reviews] = await Promise.all([
                        OAK.api('/api/staff/' + id),
                        OAK.api('/api/staff/' + id + '/availability?from=' + oakTodayISO() + '&days=7'),
                        OAK.api('/api/staff/' + id + '/reviews'),
                    ]);

                    this.staff = profile;
                    /* The title is assembled around a name, so it can never be a dictionary
                       key of its own — only the wording in front of the name can be. */
                    const prefix = 'Hồ sơ chuyên gia';
                    OAK.meta({
                        title: (window.OAKI18N ? window.OAKI18N.label(prefix) : prefix)
                            + ' - ' + profile.name + ' - OAK Beauty',
                        description: profile.bio,
                        image: profile.image,
                    });
                    this.week = availability.week;
                    this.reviews = reviews;
                    this.reviewMeta = { total: reviews.meta.total, average: reviews.meta.average };
                } catch (error) {
                    OAK.toast(error.message, 'error');
                } finally {
                    this.loading = false;
                }
            },

            /** ?id=, or the first technician of the flagship salon so the page is never empty. */
            async resolveId() {
                const id = OAK.qs('id');
                if (id) {
                    return encodeURIComponent(id);
                }
                const [salon] = await OAK.api('/api/salons?flagship=1&limit=1');
                const staff = salon ? await OAK.api('/api/salons/' + salon.id + '/staff') : [];
                if (!staff.length) {
                    throw new Error('Không tìm thấy chuyên gia này.');
                }
                return staff[0].id;
            },

            /** "Vẽ móng nghệ thuật, Đắp gel" → one chip per skill. */
            specialties() {
                return (this.staff.specialty || '')
                    .split(',')
                    .map((tag) => tag.trim())
                    .filter(Boolean);
            },

            /** The portfolio tiles are the only way into the full-size viewer. */
            openLightbox(index) {
                this.lightboxIndex = index;
                this.lightbox = true;
            },

            /** Wraps around, so prev/next always have somewhere to go. */
            stepLightbox(step) {
                const count = this.staff.portfolio.length || 1;
                this.lightboxIndex = (this.lightboxIndex + step + count) % count;
            },

            /** Days off come back with an empty slot list and are not worth a heading. */
            workingDays() {
                return this.week.filter((day) => day.slots.length);
            },

            slotClass(date, slot) {
                if (!slot.available) {
                    return 'bg-surface-variant text-on-surface-variant border border-surface-variant opacity-50 cursor-not-allowed';
                }
                return this.date === date && this.time === slot.time
                    ? 'border border-primary bg-surface-variant transition-colors'
                    : 'border border-outline-variant hover:border-primary hover:bg-surface-variant transition-colors';
            },

            pick(date, time) {
                const same = this.date === date && this.time === time;
                this.date = same ? '' : date;
                this.time = same ? '' : time;
            },

            async loadMoreReviews() {
                try {
                    const nextPage = this.reviewPage + 1;
                    const more = await OAK.api(
                        '/api/staff/' + this.staff.id + '/reviews?page=' + nextPage,
                    );
                    this.reviews = this.reviews.concat(more);
                    this.reviewPage = nextPage;
                } catch (error) {
                    OAK.toast(error.message, 'error');
                }
            },

            /** dat-lich.html with this technician, plus the slot picked from the week grid. */
            bookingUrl() {
                const params = new URLSearchParams({
                    salon_id: this.staff.salon.id,
                    staff_id: this.staff.id,
                });
                if (this.time) {
                    params.set('date', this.date);
                    params.set('time', this.time);
                }
                return 'dat-lich.html?' + params.toString();
            },
        };
    }
</script>
