# The suites that used to run only on one laptop. Nothing here deploys: Render builds from
# the same push regardless, so this is the record of whether the push was green.
name: test

# Nothing here writes anything back to the repository.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run test:unit
        working-directory: server

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oak_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: node test/api-smoke.mjs
        working-directory: server
        env:
          OAK_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/oak_test
          # Same clock as render.yaml gives the deployed container.
          TZ: Asia/Ho_Chi_Minh

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/i18n/check-rules.js
      - name: i18n coverage (advisory)
        run: node tools/i18n/check-coverage.js
      # The one build artefact that ships prebuilt and can silently go stale.
      - run: npm ci && npm run check:css
        working-directory: tools/tailwind
