services:
  - type: web
    name: oak-demo
    runtime: node
    plan: free
    rootDir: server
    # rootDir makes Render ignore commits outside server/ — but the app serves ../ui
    # statically, so UI-only commits must trigger deploys too.
    buildFilter:
      paths:
        - server/**
        - ui/**
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Set these three in the Render dashboard (sync: false keeps secrets out of git).
      # Values come from the Supabase project — see DEPLOY.md.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
