services:
  - type: web
    name: oak-demo
    runtime: node
    plan: free
    rootDir: server
    # rootDir makes Render ignore commits outside server/ — but the app serves ../ui
    # statically, so UI-only commits must trigger deploys too.
    buildFilter:
      paths:
        - server/**
        - ui/**
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
