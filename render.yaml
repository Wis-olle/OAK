services:
  - type: web
    name: oak-demo
    runtime: node
    plan: free
    # Next to Supabase's Singapore project, ~200ms closer to Vietnam than Oregon. Render
    # cannot move an existing service, so today's service is still in Oregon — DEPLOY.md §2.
    region: singapore
    rootDir: server
    # rootDir makes Render ignore commits outside server/ — but the app serves ../ui
    # statically, so UI-only commits must trigger deploys too.
    buildFilter:
      paths:
        - server/**
        - ui/**
    # The unit suite runs as part of the build, so a red one fails the deploy. The free plan
    # has no preDeployCommand and Render deploys a commit whether or not GitHub Actions went
    # green, so without this there was nothing at all between a broken push and production.
    # Affordable here because `npm run test:unit` opens no database and no socket: it reads
    # source and markup and drives lifted functions, and takes about three seconds. The smoke
    # suite needs a Postgres of its own and stays in CI. NODE_ENV=production narrows nothing —
    # server/package.json declares no devDependencies, so `npm ci` installs the same tree
    # either way and node:test is built into Node.
    buildCommand: npm ci && npm run test:unit
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      # Render containers run UTC; the app serves Vietnam, so the container clock matches
      # production convention and anything reading it stays on VN time. What the app itself
      # calls "today"/"now" is pinned to Asia/Ho_Chi_Minh by lib/time.js regardless.
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: JWT_SECRET
        generateValue: true
      # The key GET /api/internal/tick asks for. The app runs its own tick on an interval
      # (src/index.js), so nothing has to call that route — it is there for an external cron,
      # and for running the sweep on demand. Generated rather than left unset: without it the
      # route answers 503, which is the safe default but a puzzling one to meet later.
      # DEPLOY.md §8.
      - key: TICK_SECRET
        generateValue: true
      # Set these three in the Render dashboard (sync: false keeps secrets out of git).
      # Values come from the Supabase project — see DEPLOY.md.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Password-reset mail (Resend). Without RESEND_API_KEY the reset link is minted and
      # never delivered — the account is locked out — so set it before letting anyone in.
      # RESET_MAIL_FROM must be an address on a domain verified in Resend; see DEPLOY.md.
      - key: RESEND_API_KEY
        sync: false
      - key: RESET_MAIL_FROM
        sync: false
